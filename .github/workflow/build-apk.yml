name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare project
        run: |
          SETTINGS="$(find . -type f -name "settings.gradle.kts" -not -path "./.git/*" | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          sed -i -E 's/compileSdk = [0-9]+/compileSdk = 36/' "$APP_GRADLE"
          sed -i -E 's/targetSdk = [0-9]+/targetSdk = 36/' "$APP_GRADLE"

          sed -i -E 's#androidx.core:core-ktx:[^"]+#androidx.core:core-ktx:1.17.0#' "$APP_GRADLE"
          sed -i -E 's#androidx.activity:activity-ktx:[^"]+#androidx.activity:activity-ktx:1.12.4#' "$APP_GRADLE"

          echo "Building project from: $PROJECT_DIR"
          grep -E 'compileSdk|targetSdk|core-ktx|activity-ktx' "$APP_GRADLE"

      - name: Build Lupa APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lupa-OCR-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
