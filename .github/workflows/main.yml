name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify project
        run: |
          echo "Repository:"
          ls -la

          echo "LupaOCR:"
          ls -la LupaOCR

          test -f "LupaOCR/settings.gradle.kts"
          test -f "LupaOCR/build.gradle.kts"
          test -f "LupaOCR/app/build.gradle.kts"

          echo "LupaOCR OK"

      - name: Build Lupa APK
        working-directory: ./LupaOCR
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Lupa-OCR-APK
          path: LupaOCR/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
